<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kurssipistelaskuri (OhPe / OhJa)</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 24px; max-width: 820px; }
    label { display:block; margin-top: 12px; font-weight: 600; }
    input, select, button { font: inherit; padding: 8px; width: 100%; box-sizing: border-box; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .out { background: #f6f6f6; padding: 12px; border-radius: 8px; margin-top: 16px; }
    .small { font-size: 0.92rem; color:#333; margin-top: 6px; line-height: 1.35; }
    .warn { color: #8a5a00; font-weight: 600; }
    button { margin-top: 16px; cursor: pointer; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
</head>
<body>
  <h1>Kurssipistelaskuri</h1>

  <div class="row">
    <div>
      <label for="course">Kurssi</label>
      <select id="course">
        <option value="1">1. OhPe</option>
        <option value="2">2. OhJa</option>
      </select>
    </div>

    <div>
      <label for="exam">Koepisteet (0–30)</label>
      <input id="exam" type="number" min="0" max="30" step="0.01" placeholder="esim. 24" />
    </div>
  </div>

  <label for="perc">Prosentit (erota pilkuilla)</label>
  <input id="perc" type="text" placeholder="esim. 100, 80, 90, 100, 75, 60, 100" />

  <div id="meta" class="small"></div>
  <div id="ohjaWarn" class="small warn"></div>

  <button id="calc">Laske</button>

  <div class="out">
    <div id="errors" style="color:#b00020; font-weight:600;"></div>
    <div id="results"></div>
  </div>

  <script>
    const MAX_POINTS = {
      "1": [31, 26, 34, 38, 30, 22, 20], // OhPe
      "2": [27, 31, 23, 24, 28, 17, 1]   // OhJa
    };

    const courseEl = document.getElementById("course");
    const examEl   = document.getElementById("exam");
    const percEl   = document.getElementById("perc");
    const metaEl   = document.getElementById("meta");
    const warnEl   = document.getElementById("ohjaWarn");
    const errEl    = document.getElementById("errors");
    const resEl    = document.getElementById("results");

    function countEnteredPercentages(raw) {
      // Count comma-separated "items" that are non-empty after trimming.
      // This is purely a typing counter; it doesn't validate numbers.
      return raw
        .split(",")
        .map(s => s.trim())
        .filter(s => s !== "")
        .length;
    }

    function parsePercentList(s) {
      // Split by comma, trim, allow spaces; ignore empty items.
      const parts = s.split(",").map(x => x.trim()).filter(x => x !== "");
      const nums = parts.map((p) => {
        const v = Number(p.replace(",", ".")); // tolerate "12,5" typed as one item
        if (!Number.isFinite(v)) throw new Error(`Virheellinen prosentti: "${p}"`);
        return v;
      });
      return nums;
    }

    function round2(x) {
      return Math.round((x + Number.EPSILON) * 100) / 100;
    }

    function updateMetaAndWarnings() {
      const course = courseEl.value;
      const maxPts = MAX_POINTS[course];
      const needed = maxPts.length;

      // (1) Dynamic counter while typing
      const entered = countEnteredPercentages(percEl.value);
      metaEl.innerHTML =
        `Syötettyjä prosentteja: <b>${entered}</b> / ${needed}. ` +
        `Maksimipisteet: <code>${maxPts.join(", ")}</code>.`;

      // (2) OhJa: warn if 7th percentage < 100 (when present and numeric)
      warnEl.textContent = "";
      if (course === "2") {
        try {
          const percs = parsePercentList(percEl.value);
          if (percs.length >= 7) {
            const seventh = percs[6];
            if (seventh < 100) {
              warnEl.textContent =
                `Huom: OhJa-kurssilla 7. prosentti on ${seventh} (< 100).`;
            }
          }
        } catch {
          // Ignore parse errors here; main calculation will show the error.
        }
      }
    }

    function calc() {
      errEl.textContent = "";
      resEl.innerHTML = "";

      const course = courseEl.value;
      const maxPts = MAX_POINTS[course];

      let exam = Number(String(examEl.value).trim());
      if (!Number.isFinite(exam)) {
        errEl.textContent = "Anna koepisteet numerona (0–30).";
        return;
      }
      if (exam < 0) exam = 0;
      if (exam > 30) exam = 30;

      let percs;
      try {
        percs = parsePercentList(percEl.value);
      } catch (e) {
        errEl.textContent = e.message;
        return;
      }

      if (percs.length !== maxPts.length) {
        errEl.textContent =
          `Annoit ${percs.length} prosenttia, mutta tälle kurssille niitä pitää olla ${maxPts.length}.`;
        return;
      }

      const roundPoints = percs.map((pct, i) => (pct / 100) * maxPts[i]);
      const totalRoundPoints = roundPoints.reduce((a, b) => a + b, 0);
      const sumMax = maxPts.reduce((a, b) => a + b, 0);

      const weighted = (totalRoundPoints / sumMax) * 50;
      const examWeighted = (exam / 30) * 50;
      const combined = weighted + examWeighted;

      resEl.innerHTML = `
        <p><b>Kierrospisteet:</b> <code>[${roundPoints.map(round2).join(", ")}]</code></p>
        <p><b>Yhteensä:</b> ${round2(totalRoundPoints)}</p>
        <p><b>Painotettu (0–50):</b> ${round2(weighted)}</p>
        <p><b>Tentti painotettu (0–50):</b> ${round2(examWeighted)}</p>
        <p><b>Yhdistetty (0–100):</b> ${round2(combined)}</p>
      `;
    }

    document.getElementById("calc").addEventListener("click", calc);
    courseEl.addEventListener("change", () => {
      updateMetaAndWarnings();
    });
    percEl.addEventListener("input", updateMetaAndWarnings);

    updateMetaAndWarnings();
  </script>
</body>
</html>
